name: Build shared libraries

on:
  workflow_dispatch:
    branches:
      - master
    inputs:
      version:
        description: "Version number"
        required: true
      body:
        description: "Description of the release"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build both debug and release versions for Linux
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --verbose -p dijkstra_map_gd
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --verbose -p dijkstra_map_gd
      - name: Rename and group library files
        run: |
          mkdir artifacts
          mv target/debug/libdijkstra_map_gd.so artifacts/dijkstra_map_gd.linux.debug.so
          mv target/release/libdijkstra_map_gd.so artifacts/dijkstra_map_gd.linux.release.so
      - name: Strip library files
        run: |
          strip artifacts/dijkstra_map_gd.linux.debug.so
          strip artifacts/dijkstra_map_gd.linux.release.so
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.linux.debug.so
          path: artifacts/dijkstra_map_gd.linux.debug.so
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.linux.release.so
          path: artifacts/dijkstra_map_gd.linux.release.so

  # Build both debug and release versions for Windows
  build-windows:
    runs-on: windows-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --verbose -p dijkstra_map_gd --target x86_64-pc-windows-msvc
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --verbose -p dijkstra_map_gd --target x86_64-pc-windows-msvc
      - name: Rename and group library files
        run: |
          mkdir artifacts
          move target/x86_64-pc-windows-msvc/debug/dijkstra_map_gd.dll artifacts/dijkstra_map_gd.windows.debug.dll
          move target/x86_64-pc-windows-msvc/release/dijkstra_map_gd.dll artifacts/dijkstra_map_gd.windows.release.dll
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.windows.debug.dll
          path: artifacts/dijkstra_map_gd.windows.debug.dll
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.windows.release.dll
          path: artifacts/dijkstra_map_gd.windows.release.dll

  # Build both debug and release versions for MacOS
  build-macos:
    runs-on: macos-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-apple-darwin
          default: true
          override: true
      - uses: Swatinem/rust-cache@v2
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: -p dijkstra_map_gd
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release -p dijkstra_map_gd
      - name: Rename and group library files
        run: |
          mkdir artifacts
          mv target/debug/libdijkstra_map_gd.dylib artifacts/dijkstra_map_gd.mac.debug.dylib
          mv target/release/libdijkstra_map_gd.dylib artifacts/dijkstra_map_gd.mac.release.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.mac.debug.dylib
          path: artifacts/dijkstra_map_gd.mac.debug.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.mac.release.dylib
          path: artifacts/dijkstra_map_gd.mac.release.dylib

  # Build both debug and release versions for MacOS ARM
  build-macos-arm:
    runs-on: macos-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          default: true
          override: true
      - uses: Swatinem/rust-cache@v2
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: -p dijkstra_map_gd
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release -p dijkstra_map_gd
      - name: Rename and group library files
        run: |
          mkdir artifacts
          mv target/debug/libdijkstra_map_gd.dylib artifacts/dijkstra_map_gd.mac_arm.debug.dylib
          mv target/release/libdijkstra_map_gd.dylib artifacts/dijkstra_map_gd.mac_arm.release.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.mac_arm.debug.dylib
          path: artifacts/dijkstra_map_gd.mac_arm.debug.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.mac_arm.release.dylib
          path: artifacts/dijkstra_map_gd.mac_arm.release.dylib

