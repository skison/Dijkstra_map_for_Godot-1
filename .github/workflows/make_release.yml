name: Build shared libraries

on:
  workflow_dispatch:
    branches:
      - master
    inputs:
      version:
        description: "Version number"
        required: true
      body:
        description: "Description of the release"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build both debug and release versions for Linux
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --verbose -p dijkstra_map_gd
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --verbose -p dijkstra_map_gd
      - name: Rename and group library files
        run: |
          mkdir artifacts
          mv target/debug/libdijkstra_map_gd.so artifacts/dijkstra_map_gd.linux.debug.so
          mv target/release/libdijkstra_map_gd.so artifacts/dijkstra_map_gd.linux.release.so
      - name: Strip library files
        run: |
          strip artifacts/dijkstra_map_gd.linux.debug.so
          strip artifacts/dijkstra_map_gd.linux.release.so
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.linux.debug.so
          path: artifacts/dijkstra_map_gd.linux.debug.so
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.linux.release.so
          path: artifacts/dijkstra_map_gd.linux.release.so

  # Build both debug and release versions for Windows
  # This jobs running on ubuntu-latest may be surprising : it's because I
  # couldn't make the build succeed on windows, but using the
  # x86_64-pc-windows-gnu on linux works perfectly well.
  build-windows:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # we need a windows linker
      - name: Install gcc-mingw-w64-x86-64 linker
        run: sudo apt install gcc-mingw-w64-x86-64
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --verbose -p dijkstra_map_gd --target x86_64-pc-windows-gnu
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --verbose -p dijkstra_map_gd --target x86_64-pc-windows-gnu
      - name: Rename and group library files
        run: |
          mkdir artifacts
          mv target/x86_64-pc-windows-gnu/debug/dijkstra_map_gd.dll artifacts/dijkstra_map_gd.windows.debug.dll
          mv target/x86_64-pc-windows-gnu/release/dijkstra_map_gd.dll artifacts/dijkstra_map_gd.windows.release.dll
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.windows.debug.dll
          path: artifacts/dijkstra_map_gd.windows.debug.dll
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.windows.release.dll
          path: artifacts/dijkstra_map_gd.windows.release.dll

  # Build both debug and release versions for MacOS
  build-macos:
    runs-on: macos-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-apple-darwin
          default: true
          override: true
      - uses: Swatinem/rust-cache@v2
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: -p dijkstra_map_gd
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release -p dijkstra_map_gd
      - name: Rename and group library files
        run: |
          mkdir artifacts
          mv target/debug/libdijkstra_map_gd.dylib artifacts/dijkstra_map_gd.mac.debug.dylib
          mv target/release/libdijkstra_map_gd.dylib artifacts/dijkstra_map_gd.mac.release.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.mac.debug.dylib
          path: artifacts/dijkstra_map_gd.mac.debug.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra_map_gd.mac.release.dylib
          path: artifacts/dijkstra_map_gd.mac.release.dylib

  commit:
    runs-on: ubuntu-latest

    needs: [build-linux, build-windows, build-macos]

    steps:
      - uses: actions/checkout@v3
      - name: Download dijkstra_map_gd.linux.debug.so
        uses: actions/download-artifact@v4
        with:
          name: dijkstra_map_gd.linux.debug.so
          path: addons/dijkstra-map/dijkstra_map_library/bin/
      - name: Download dijkstra_map_gd.linux.release.so
        uses: actions/download-artifact@v4
        with:
          name: dijkstra_map_gd.linux.release.so
          path: addons/dijkstra-map/dijkstra_map_library/bin/
      - name: Download dijkstra_map_gd.windows.debug.dll
        uses: actions/download-artifact@v4
        with:
          name: dijkstra_map_gd.windows.debug.dll
          path: addons/dijkstra-map/dijkstra_map_library/bin/
      - name: Download dijkstra_map_gd.windows.release.dll
        uses: actions/download-artifact@v4
        with:
          name: dijkstra_map_gd.windows.release.dll
          path: addons/dijkstra-map/dijkstra_map_library/bin/
      - name: Download dijkstra_map_gd.mac.debug.dylib
        uses: actions/download-artifact@v4
        with:
          name: dijkstra_map_gd.mac.debug.dylib
          path: addons/dijkstra-map/dijkstra_map_library/bin/
      - name: Download dijkstra_map_gd.mac.release.dylib
        uses: actions/download-artifact@v4
        with:
          name: dijkstra_map_gd.mac.release.dylib
          path: addons/dijkstra-map/dijkstra_map_library/bin/
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Release ${{ github.event.inputs.version }}\n${{ github.event.inputs.body }}"
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          tagging_message: "${{ github.event.inputs.version }}\n${{ github.event.inputs.body }}"
